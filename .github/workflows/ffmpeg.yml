name: FFmpeg sidecars
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/build-ffmpeg.sh', '.github/workflows/ffmpeg.yml', '.github/workflows/release.yml']
  push:
    paths: ['scripts/build-ffmpeg.sh', '.github/workflows/ffmpeg.yml', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: ubuntu-24.04
            name: windows-x86_64
          - platform: linux
            os: ubuntu-22.04
            name: linux-x86_64
          - platform: macos
            os: macos-15-intel
            name: macos-x86_64
          - platform: macos
            os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make pkg-config nasm curl ca-certificates patchelf gcc-mingw-w64-x86-64
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config nasm
      - name: Build pinned sources
        run: bash scripts/build-ffmpeg.sh "${{ matrix.platform }}" "$RUNNER_TEMP/sidecar"
      - name: Archive executable permissions
        run: tar -czf "$RUNNER_TEMP/sidecar.tar.gz" -C "$RUNNER_TEMP/sidecar" .
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.name }}
          path: ${{ runner.temp }}/sidecar.tar.gz
          retention-days: 7
