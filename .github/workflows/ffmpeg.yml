name: Windows FFmpeg sidecar
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/build-ffmpeg-windows.sh', '.github/workflows/ffmpeg.yml', '.github/workflows/release.yml']
  push:
    paths: ['scripts/build-ffmpeg-windows.sh', '.github/workflows/ffmpeg.yml', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nasm make pkg-config curl ca-certificates
      - name: Build pinned sources
        run: bash scripts/build-ffmpeg-windows.sh "$RUNNER_TEMP/sidecar"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/sidecar/
          retention-days: 7
