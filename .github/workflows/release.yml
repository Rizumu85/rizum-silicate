
name: Releases
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BIN_NAME: silicate
  BUNDLE_NAME: Rizum Silicate

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
  build_job:
    needs: ffmpeg
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
        - build: x86_64-linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-gnu
          cross: false
          bundle: rizum-silicate
        - build: x86_64-macos
          os: macos-latest
          rust: stable
          target: x86_64-apple-darwin
          cross: false
          bundle: Rizum-Silicate-macos-x86_64.dmg
        - build: x86_64-windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          cross: false
          bundle: Rizum-Silicate-windows-x86_64.zip
        - build: aarch64-macos
          os: macos-latest
          rust: stable
          target: aarch64-apple-darwin
          bundle: Rizum-Silicate-macos-arm64.dmg

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        if: matrix.os == 'macos-latest'
        run: cargo install cargo-bundle

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS bundle
        if: matrix.os == 'macos-latest'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Package macOS DMG
        shell: bash
        if: matrix.os == 'macos-latest'
        run: >-
            hdiutil create "target/${{ matrix.target }}/release/bundle/osx/${{ matrix.bundle }}"
            -volname "${{ env.BUNDLE_NAME }}"
            -srcfolder "target/${{ matrix.target }}/release/bundle/osx/${{ env.BUNDLE_NAME }}.app" -ov

      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          mkdir package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "package/Rizum Silicate.exe"
            cp LICENSE package/LICENSE.txt
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp "target/${{ matrix.target }}/release/bundle/osx/${{ matrix.bundle }}" "dist/${{ matrix.bundle }}"
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/${{ matrix.bundle }}"
          fi

      - name: Download verified Windows sidecar
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows-verified
          path: package

      - name: Finalize Windows archive
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path package/* -DestinationPath "dist/${{ matrix.bundle }}"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.bundle }}
