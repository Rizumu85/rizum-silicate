
name: Releases
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BIN_NAME: silicate
  BUNDLE_NAME: Rizum Silicate

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
  build_job:
    needs: ffmpeg
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
        - build: x86_64-linux
          os: ubuntu-22.04
          rust: stable
          target: x86_64-unknown-linux-gnu
          bundle: Rizum-Silicate-linux-x86_64.tar.gz
          sidecar: linux-x86_64
        - build: x86_64-macos
          os: macos-15-intel
          rust: stable
          target: x86_64-apple-darwin
          bundle: Rizum-Silicate-macos-x86_64.dmg
          sidecar: macos-x86_64
        - build: x86_64-windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          bundle: Rizum-Silicate-windows-x86_64.zip
          sidecar: windows-x86_64
        - build: aarch64-macos
          os: macos-15
          rust: stable
          target: aarch64-apple-darwin
          bundle: Rizum-Silicate-macos-arm64.dmg
          sidecar: macos-arm64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux app dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Download source-built sidecar
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.sidecar }}
          path: .sidecar

      - name: Stage release
        shell: bash
        run: |
          mkdir dist package
          tar -xzf .sidecar/sidecar.tar.gz -C package
          cp LICENSE package/LICENSE.txt
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "package/Rizum Silicate.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            app="target/${{ matrix.target }}/release/bundle/osx/${{ env.BUNDLE_NAME }}.app"
            cp -R package/tools "$app/Contents/MacOS/tools"
            cp LICENSE "$app/Contents/Resources/LICENSE.txt"
            codesign --force --deep --sign - "$app"
            hdiutil create "dist/${{ matrix.bundle }}" -volname "${{ env.BUNDLE_NAME }}" -srcfolder "$app" -ov
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" package/silicate
            tar -czf "dist/${{ matrix.bundle }}" -C package .
          fi

      - name: Finalize Windows archive
        shell: pwsh
        if: runner.os == 'Windows'
        run: Compress-Archive -Path package/* -DestinationPath "dist/${{ matrix.bundle }}"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.bundle }}
