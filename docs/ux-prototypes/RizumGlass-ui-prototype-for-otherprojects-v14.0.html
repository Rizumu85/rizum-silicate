<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Pet — v14.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        serif: ['"New York"', '"Noto Serif SC"', '"Songti SC"', 'Georgia', 'serif'],
        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"', 'system-ui', 'sans-serif'],
        mono: ['"SF Mono"', '"Fira Code"', 'Menlo', 'monospace'],
      },
    }
  }
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: grid; grid-template-columns: 200px 1fr;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  overflow: hidden; color: #18181b;
}

.ambient {
  background:
    radial-gradient(ellipse at 20% 30%, rgba(167,139,250,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(129,230,217,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(251,191,36,.04) 0%, transparent 60%),
    #f0f0f0;
}
.glass {
  background: rgba(255,255,255,.62);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255,255,255,.5);
  box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 20px 60px rgba(0,0,0,.06);
}
.glass-s {
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,.35);
}

/* ── 点彩 dot accent colors ── */
.dot-teal { color: #2dd4bf; }
.dot-amber { color: #fbbf24; }
.dot-rose { color: #fb7185; }
.dot-violet { color: #a78bfa; }
.dot-green { color: #86efac; }

.sw { position: relative; width: 28px; height: 16px; flex-shrink: 0; }
.sw input { opacity: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; margin: 0; }
.sw .tr { position: absolute; inset: 0; border-radius: 999px; background: #d4d4d8; transition: background .25s; }
.sw .tr::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: #fff; box-shadow: 0 .5px 1px rgba(0,0,0,.1); transition: transform .25s cubic-bezier(.34,1.56,.64,1);
}
.sw input:checked + .tr { background: #a1a1aa; }
.sw input:checked + .tr::after { transform: translateX(12px); }

.sl { -webkit-appearance: none; width: 100%; height: 2px; border-radius: 1px; background: #e4e4e7; outline: none; }
.sl::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: #a1a1aa; cursor: pointer;
  box-shadow: 0 0 8px 2px rgba(161,161,170,.2);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
}
.sl::-webkit-slider-thumb:hover { transform: scale(1.3); box-shadow: 0 0 14px 4px rgba(161,161,170,.25); }

@keyframes float-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes pop-in { 0% { opacity: 0; transform: scale(.92) translateY(6px); } 55% { transform: scale(1.02) translateY(-1px); } 100% { opacity: 1; transform: none; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(14px); } }
@keyframes slide-down { from { opacity: 0; transform: translateY(-10px); } }
@keyframes scale-in { from { opacity: 0; transform: scale(.94); } }
@keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .7; } }
@keyframes bounce-s { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes fade-row { from { opacity: 0; transform: translateX(-6px); } }
@keyframes stamp-in {
  0% { opacity: 0; transform: scale(3) rotate(calc(var(--stamp-rot, -6deg) - 9deg)); }
  50% { opacity: 1; transform: scale(.88) rotate(calc(var(--stamp-rot, -6deg) + 9deg)); }
  100% { transform: scale(1) rotate(var(--stamp-rot, -6deg)); }
}
@keyframes ticker-scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
@keyframes wave-bar { 0%, 100% { height: 3px; } 50% { height: 10px; } }
@keyframes cont-pulse { 0%, 100% { opacity: .25; transform: translateX(0); } 50% { opacity: .5; transform: translateX(2px); } }
@keyframes thinking-dot { 0%, 80%, 100% { opacity: .22; transform: translateY(0); } 40% { opacity: .72; transform: translateY(-2px); } }

.a-float { animation: float-in .4s cubic-bezier(.34,1.56,.64,1) both; }
.a-pop { animation: pop-in .5s cubic-bezier(.34,1.56,.64,1) both; }
.a-slide { animation: slide-up .4s cubic-bezier(.22,1,.36,1) both; }
.a-down { animation: slide-down .35s cubic-bezier(.22,1,.36,1) both; }
.a-scale { animation: scale-in .3s cubic-bezier(.34,1.56,.64,1) both; }
.a-row { animation: fade-row .3s cubic-bezier(.22,1,.36,1) both; }
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
.d7{animation-delay:.35s}.d8{animation-delay:.4s}

.nc {
  padding: 5px 11px; border-radius: 8px; font-size: 12px;
  border: 1px solid transparent; cursor: pointer;
  transition: background-color .18s, border-color .18s, color .18s, transform .18s cubic-bezier(.34,1.56,.64,1);
  background: transparent; color: #d4d4d8;
  display: inline-flex; align-items: center; gap: 5px;
}
.nc:hover { color: #a1a1aa; }
.nc.on { background: rgba(0,0,0,.02); border-color: #e4e4e7; color: #52525b; }
.nc .nd { width: 4px; height: 4px; border-radius: 50%; transition: opacity .2s, transform .2s cubic-bezier(.34,1.56,.64,1); opacity: .5; }
.nc.on .nd { opacity: .9; transform: scale(1.12); }
.nc .nt {
  display: inline-block;
  transition: opacity .18s, transform .18s cubic-bezier(.34,1.56,.64,1);
  opacity: .76;
  transform: translateY(.35px);
}
.nc.on .nt { opacity: 1; transform: translateY(-.35px); }
.nc:active .nt { transform: translateY(0) scale(.98); }

.seg { display: inline-flex; border-radius: 8px; background: rgba(0,0,0,.03); padding: 2px; gap: 1px; }
.seg button { padding: 4px 12px; border: 0; border-radius: 6px; font-size: 11.5px; background: transparent; color: #a1a1aa; cursor: pointer; transition: all .2s; }
.seg button.on { background: #fff; color: #3f3f46; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.seg-motion { position: relative; overflow: hidden; isolation: isolate; }
.seg-motion::before {
  content: ''; position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 5px) / 2); border-radius: 6px;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  z-index: 0;
}
.seg-motion[data-active="1"]::before { transform: translateX(calc(100% + 1px)); }
.seg-motion button { min-width: 44px; position: relative; z-index: 1; }
.seg-motion button.on { background: transparent; box-shadow: none; color: #3f3f46; }

.nb { text-align: left; padding: 6px 10px; border: 0; border-radius: 7px; width: 100%; background: transparent; font-size: 12px; color: #a1a1aa; cursor: pointer; transition: background .1s, color .1s; }
.nb:hover { background: #f4f4f5; color: #71717a; }
.nb.on { background: #f4f4f5; color: #18181b; font-weight: 500; }

.btn { padding: 6px 13px; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; color: #52525b; font-size: 12px; cursor: pointer; transition: all .18s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 1px 2px rgba(0,0,0,.02); }
.btn:hover { border-color: #d4d4d8; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.04); }
.btn:active { transform: scale(.97); }
.btn-p { background: #fff; border-color: #e4e4e7; color: rgba(63,63,70,.86); font-weight: 400; }
.btn-star { display: inline-flex; align-items: center; gap: 5px; }
.btn-star svg { flex-shrink: 0; }
.btn-special { background: #fff; border-color: #e4e4e7; color: #52525b; font-weight: 400; }
.btn-special svg { flex-shrink: 0; }
.quick-tool {
  width: 24px; height: 24px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(113,113,122,.38); background: transparent;
  border: 1px solid transparent;
  box-shadow: none;
  backdrop-filter: blur(0) saturate(100%);
  -webkit-backdrop-filter: blur(0) saturate(100%);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease, backdrop-filter .18s ease;
}
.quick-tool:hover {
  transform: translateY(-1px);
  color: rgba(82,82,91,.66);
  background: rgba(255,255,255,.56);
  border-color: rgba(255,255,255,.62);
  box-shadow: 0 1px 0 rgba(255,255,255,.62) inset, 0 8px 18px rgba(0,0,0,.045);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
}
.quick-tool:active { transform: scale(.95); }
.quick-tool svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.75; }
.quick-tool.mic svg { width: 13px; height: 13px; stroke-width: 1.65; }
.ob-rail { display: flex; align-items: center; gap: 6px; }
.ob-step {
  width: 7px; height: 7px; border: 0; border-radius: 999px; padding: 0;
  background: rgba(161,161,170,.22); cursor: pointer;
  transition: width .24s cubic-bezier(.34,1.56,.64,1), background .18s, opacity .18s, transform .18s cubic-bezier(.34,1.56,.64,1);
}
.ob-step:hover { background: rgba(161,161,170,.36); transform: scale(1.15); }
.ob-step.on { width: 24px; background: rgba(45,212,191,.56); box-shadow: 0 0 0 3px rgba(45,212,191,.08); }
.ob-step:active { transform: scale(.92); }
.onboarding-card {
  width: var(--ob-w, 340px);
  transition: width .28s cubic-bezier(.22,1,.36,1);
}
.ob-panel { display: none; }
.ob-panel.on { display: block; animation: slide-up .34s cubic-bezier(.22,1,.36,1) both; }
.ob-choice {
  border: 1px solid rgba(255,255,255,.34); border-radius: 12px; background: rgba(255,255,255,.34);
  padding: 10px 11px;
}
.ob-choice:hover { background: rgba(255,255,255,.44); }
.api-dot { width: 4px; height: 4px; border-radius: 999px; flex-shrink: 0; opacity: .82; }
.mod-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px;
  border-radius: 999px; background: rgba(255,255,255,.38); border: 1px solid rgba(255,255,255,.34);
  color: rgba(113,113,122,.62); font-size: 9px; line-height: 1;
}
.mod-card {
  border: 1px solid rgba(255,255,255,.34); border-radius: 14px; background: rgba(255,255,255,.34);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.48);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s, box-shadow .18s;
}
.mod-card:hover { transform: translateY(-1px); background: rgba(255,255,255,.48); border-color: rgba(255,255,255,.58); box-shadow: inset 0 1px 0 rgba(255,255,255,.68), 0 10px 26px rgba(0,0,0,.04); }
.mod-row {
  width: 100%; text-align: left; border: 1px solid transparent; border-radius: 12px; background: transparent;
  padding: 10px; transition: background .18s, border-color .18s, transform .18s cubic-bezier(.34,1.56,.64,1);
}
.mod-row:hover, .mod-row.on { background: rgba(255,255,255,.42); border-color: rgba(255,255,255,.42); }
.mod-row:active { transform: scale(.985); }
.menu-sep-inset { height: 1px; background: #e4e4e7; margin: 6px 12px; opacity: .48; }
.bar-fill-teal { background: #2dd4bf; opacity: .72; }
.bar-fill-amber { background: #fbbf24; opacity: .74; }
.draw-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.draw-choice { min-height: 32px; justify-content: center; font-size: 11px; white-space: nowrap; }
.draw-choice.a { border-radius: 999px; }
.draw-choice.b { border-left: 3px solid rgba(45,212,191,.72); padding-left: 10px; }
.draw-choice.c { border-style: dashed; background: rgba(255,255,255,.72); }
.draw-choice.d { border-radius: 7px; box-shadow: 0 1px 0 rgba(255,255,255,.75) inset, 0 5px 14px rgba(0,0,0,.045); }
.draw-choice.d.single { width: 100%; min-height: 34px; }
.editor-action { color: #2dd4bf; }
.thinking-ellipsis { display: inline-flex; gap: 2px; margin-left: 1px; transform: translateY(2px); }
.thinking-ellipsis span { width: 3px; height: 3px; border-radius: 999px; background: rgba(0,0,0,.32); animation: thinking-dot 1.25s ease-in-out infinite; }
.thinking-ellipsis span:nth-child(2) { animation-delay: .16s; }
.thinking-ellipsis span:nth-child(3) { animation-delay: .32s; }

.mi { width: 100%; text-align: left; padding: 7px 12px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: #3f3f46; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background .1s; }
.mi:hover { background: rgba(0,0,0,.03); }

.dd { width: 100%; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.35); font-size: 12.5px; color: #3f3f46; outline: none; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a1a1aa' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; transition: border-color .2s; }
.dd:focus { border-color: rgba(0,0,0,.08); }

.sep { height: 1px; background: #e4e4e7; margin: 0 8px; opacity: .5; }

.sound-wave { display: flex; align-items: flex-end; gap: 2px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background .15s; height: 24px; }
.sound-wave:hover { background: rgba(0,0,0,.02); }
.sound-wave .bar { width: 2px; border-radius: 1px; background: #d4d4d8; transition: background .3s; }
.sound-wave.on .bar { background: #a1a1aa; }
.sound-wave:not(.on) .bar { background: #d4d4d8; }

.m-great{background:#86efac}.m-good{background:#a1a1aa}.m-mid{background:#fbbf24}.m-low{background:#f87171}
.cc { width: 24px; height: 24px; border-radius: 5px; border: 0; background: transparent; cursor: pointer; font-size: 10px; color: #a1a1aa; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px; transition: background .1s; }
.cc:hover { background: #f4f4f5; }
.cc .cd { width: 3px; height: 3px; border-radius: 50%; }
.cc.today { color: #18181b; font-weight: 600; }
.cc.future { color: #e4e4e7; }

.gacha-deck {
  position: relative; width: 340px; height: 220px;
  perspective: 1000px;
  display: flex; align-items: center; justify-content: center;
}
.g-card {
  position: absolute; left: 50%; top: 0; margin-left: -80px;
  width: 160px; height: 220px;
  transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .28s ease;
  cursor: pointer;
  transform-origin: center 78%;
}
.g-flipper {
  width: 100%; height: 100%; position: relative;
  transition: transform .6s cubic-bezier(.22,1,.36,1);
  transform-style: preserve-3d;
}
.g-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.g-face-back {
  background: linear-gradient(135deg, rgba(255,255,255,.6), rgba(255,255,255,.3));
  backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.4);
  box-shadow: 0 4px 12px rgba(0,0,0,.05);
}
.gacha-deck[data-state="shuffling"] #card-action,
.gacha-deck[data-state="shuffling"] #card-sub {
  display: none;
  opacity: 0;
  transform: translateY(2px);
}
.gacha-deck[data-state="drawn"] #card-sub {
  opacity: 0;
  transform: translateY(2px);
}
#card-action,
#card-sub {
  transition: opacity .18s ease, transform .18s ease;
}
.g-face-front {
  transform: rotateY(180deg);
  background: rgba(255,255,255,.64);
  backdrop-filter: blur(44px) saturate(210%); -webkit-backdrop-filter: blur(44px) saturate(210%);
  border: 1px solid rgba(255,255,255,.68);
  box-shadow: 0 1px 0 rgba(255,255,255,.85) inset, 0 18px 48px rgba(0,0,0,.075);
  overflow: hidden;
}
.g-face-front::before {
  content: ''; position: absolute; inset: -30% auto -30% -42%; width: 46%;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.72), rgba(255,255,255,.34), transparent);
  transform: skewX(-12deg); animation: shine-white 4s ease-in-out infinite; pointer-events: none;
}
.g-card .card-pattern {
  width: 80px; height: 80px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(0,0,0,.02), rgba(0,0,0,.04));
  display: flex; align-items: center; justify-content: center;
}
.game-mark {
  width: 31px; height: 31px; opacity: .2;
  filter: invert(1);
  transform: translateY(.5px);
}
.g-card:not(#top-card) .game-mark {
  opacity: .075;
  transform: translateY(.5px) scale(.92);
}
.reward-icon-gem {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 22px rgba(0,0,0,.055);
}
.reward-icon-gem img { width: 30px; height: 30px; image-rendering: auto; }
.reward-icon-gem.teal { background: rgba(45,212,191,.82); }
.reward-icon-gem.yellow { background: rgba(251,191,36,.82); }
.reward-icon-gem.violet { background: rgba(167,139,250,.82); }
.reward-icon-gem.rose { background: rgba(251,113,133,.82); }
.reward-icon-gem.green { background: rgba(134,239,172,.82); }
.gacha-deck[data-state="idle"] .g-card:nth-child(1) { transform: rotate(-12deg) translateX(-80px) translateY(10px); z-index: 1; }
.gacha-deck[data-state="idle"] .g-card:nth-child(2) { transform: rotate(-6deg) translateX(-40px) translateY(4px); z-index: 2; }
.gacha-deck[data-state="idle"] .g-card:nth-child(3) { transform: rotate(0deg) translateX(0); z-index: 5; }
.gacha-deck[data-state="idle"] .g-card:nth-child(4) { transform: rotate(6deg) translateX(40px) translateY(4px); z-index: 2; }
.gacha-deck[data-state="idle"] .g-card:nth-child(5) { transform: rotate(12deg) translateX(80px) translateY(10px); z-index: 1; }
@keyframes shuffle-lane-a {
  0% { transform: translateX(-116px) translateY(8px) scale(.985) rotate(0deg); z-index: 1; }
  12% { transform: translateX(-108px) translateY(3px) scale(.99) rotate(0deg); z-index: 2; }
  40% { transform: translateX(-48px) translateY(-4px) scale(1.015) rotate(0deg); z-index: 4; }
  72% { transform: translateX(66px) translateY(2px) scale(.995) rotate(0deg); z-index: 2; }
  100% { transform: translateX(-116px) translateY(8px) scale(.985) rotate(0deg); z-index: 1; }
}
@keyframes shuffle-lane-b {
  0% { transform: translateX(-58px) translateY(2px) scale(.995) rotate(0deg); z-index: 2; }
  12% { transform: translateX(-50px) translateY(-3px) scale(1) rotate(0deg); z-index: 3; }
  40% { transform: translateX(112px) translateY(7px) scale(.985) rotate(0deg); z-index: 1; }
  72% { transform: translateX(0) translateY(-5px) scale(1.018) rotate(0deg); z-index: 5; }
  100% { transform: translateX(-58px) translateY(2px) scale(.995) rotate(0deg); z-index: 2; }
}
@keyframes shuffle-lane-c {
  0% { transform: translateX(0) translateY(-6px) scale(1.02) rotate(0deg); z-index: 5; }
  12% { transform: translateX(0) translateY(-10px) scale(1.025) rotate(0deg); z-index: 5; }
  40% { transform: translateX(58px) translateY(-1px) scale(1) rotate(0deg); z-index: 4; }
  72% { transform: translateX(-58px) translateY(5px) scale(.99) rotate(0deg); z-index: 2; }
  100% { transform: translateX(0) translateY(-6px) scale(1.02) rotate(0deg); z-index: 5; }
}
@keyframes shuffle-lane-d {
  0% { transform: translateX(58px) translateY(2px) scale(.995) rotate(0deg); z-index: 3; }
  12% { transform: translateX(50px) translateY(-3px) scale(1) rotate(0deg); z-index: 3; }
  40% { transform: translateX(-112px) translateY(7px) scale(.985) rotate(0deg); z-index: 1; }
  72% { transform: translateX(112px) translateY(-3px) scale(1.01) rotate(0deg); z-index: 3; }
  100% { transform: translateX(58px) translateY(2px) scale(.995) rotate(0deg); z-index: 3; }
}
@keyframes shuffle-lane-e {
  0% { transform: translateX(116px) translateY(8px) scale(.985) rotate(0deg); z-index: 1; }
  12% { transform: translateX(108px) translateY(3px) scale(.99) rotate(0deg); z-index: 2; }
  40% { transform: translateX(0) translateY(3px) scale(1.005) rotate(0deg); z-index: 3; }
  72% { transform: translateX(-112px) translateY(-3px) scale(.99) rotate(0deg); z-index: 1; }
  100% { transform: translateX(116px) translateY(8px) scale(.985) rotate(0deg); z-index: 1; }
}

mood(){
  const days=['一','二','三','四','五','六','日'];
  const moods=['great','good','','good','great','mid','','good','good','great','','low','good','great','good','good'];
  let g='';
  for(let i=0;i<35;i++){
    const d=i-3;
    if(d<1){g+=`<div class="cc"></div>`}
    else if(d>16&&d<=31){g+=`<div class="cc future">${d}</div>`}
    else if(d>31){g+=`<div class="cc"></div>`}
    else{const m=moods[d-1]||'';g+=`<div class="cc${d===16?' today':''}">${d}${m?`<span class="cd m-${m}"></span>`:''}</div>`}
  }
  return `
  <div class="w-[260px] glass rounded-2xl a-float">
    <div class="px-4 pt-4 pb-1.5"><h2 class="text-[15px] font-bold font-serif tracking-tight">心情日历</h2><p class="text-[10px] text-[#a1a1aa]/45 mt-0.5">情绪起伏</p></div>

      <div class="flex items-center justify-between mb-2 a-slide"><button class="text-[#d4d4d8] hover:text-[#71717a] transition text-xs">‹</button><span class="text-[11px] font-serif font-medium">2026 年 5 月</span><button class="text-[#d4d4d8] hover:text-[#71717a] transition text-xs">›</button></div>
      <div class="grid grid-cols-7 gap-0 mb-0.5 a-slide d1">${days.map(d=>`<div class="text-center text-[8px] text-[#d4d4d8] py-0.5">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-0 a-slide d2">${g}</div>
      <div class="flex items-center gap-2.5 mt-2.5 text-[8px] text-[#a1a1aa]/40 a-slide d3">
        <span class="flex items-center gap-1"><span class="w-[3px] h-[3px] rounded-full m-great"></span>很好</span>
        <span class="flex items-center gap-1"><span class="w-[3px] h-[3px] rounded-full m-good"></span>还行</span>

        <span class="flex items-center gap-1"><span class="w-[3px] h-[3px] rounded-full m-low"></span>不太好</span>
      </div>
      <div class="mt-2.5 rounded-lg bg-white/40 border border-white/25 p-2 a-slide d4">

    </div>
  </div>`},

const rewardPool = [
  {svg:'<span class="reward-icon-gem yellow"><img src="./icons/game-icon-pack/music.svg" alt=""></span>',n:'新音效：水滴',t:'普通'},
  {svg:'<span class="reward-icon-gem teal"><img src="./icons/game-icon-pack/diamond.svg" alt=""></span>',n:'闪光特效',t:'稀有'},
  {svg:'<span class="reward-icon-gem violet"><img src="./icons/game-icon-pack/paintbrush.svg" alt=""></span>',n:'彩虹皮肤',t:'传说'},
  {svg:'<span class="reward-icon-gem rose"><img src="./icons/game-icon-pack/message.svg" alt=""></span>',n:'毒舌台词包',t:'普通'},
  {svg:'<span class="reward-icon-gem green"><img src="./icons/game-icon-pack/trophy.svg" alt=""></span>',n:'完成音：轻敲',t:'普通'},
];
let rewardDeck = rewardPool.slice(0, 5);
let currentReward = null;
let remainingDraws = 3;
function nextReward() {
  const candidates = rewardPool.filter(r => !rewardDeck.includes(r) && r !== currentReward);
  return candidates[Math.floor(Math.random() * candidates.length)] || rewardPool[Math.floor(Math.random() * rewardPool.length)];
}

window.handleCardInteraction = function() {
  const deck = document.getElementById('card-deck');
  const action = document.getElementById('card-action');
  const sub = document.getElementById('card-sub');
  if (!deck || remainingDraws <= 0) return;
  const currentState = deck.getAttribute('data-state');

  if (currentState === 'idle') {
    deck.setAttribute('data-state', 'shuffling');
    if (action) action.textContent = '洗牌中';
    if (sub) sub.textContent = '正在选择奖励';

    const slotIndex = Math.floor(Math.random() * rewardDeck.length);
    currentReward = rewardDeck[slotIndex] || nextReward();

    document.getElementById('card-icon').innerHTML = currentReward.svg;
    document.getElementById('card-label').textContent = currentReward.n;
    document.getElementById('card-type').textContent = `${currentReward.t} · 点击收下`;

    setTimeout(() => {
      deck.setAttribute('data-state', 'drawn');
      if (action) action.textContent = '点击翻开';
      if (sub) sub.textContent = '';
    }, 1920);
  } else if (currentState === 'drawn') {
    deck.setAttribute('data-state', 'revealed');
    if (action) action.textContent = '点击收下';
    if (sub) sub.textContent = currentReward ? currentReward.t : '奖励已揭晓';
  } else if (currentState === 'revealed') {
    deck.setAttribute('data-state', 'collecting');

    remainingDraws = Math.max(0, remainingDraws - 1);
    const usedIndex = rewardDeck.indexOf(currentReward);
    if (usedIndex >= 0) rewardDeck.splice(usedIndex, 1);
    rewardDeck.push(nextReward());
    currentReward = null;

    if (action) action.textContent = remainingDraws > 0 ? '点击洗牌' : '今日已抽完';
    if (sub) sub.textContent = remainingDraws > 0 ? `还剩 ${remainingDraws} 次机会` : '明天再来';

    setTimeout(() => {
      deck.setAttribute('data-state', 'idle');
    }, 600);
  }
};

function toggleSoundWave(el){
  if(el.classList.contains('on')){
    stopSoundWave(el);
    el.classList.remove('on');
  }else{
    el.classList.add('on');
    startSoundWave(el);
  }
}

function startSoundWave(el){
  const bars=[...el.querySelectorAll('.bar')];
  if(!el._wave) el._wave={ elapsed: 0, last: 0, raf: 0 };
  if(el._wave.raf) cancelAnimationFrame(el._wave.raf);
  if(el._wave.timer) clearTimeout(el._wave.timer);
  const tick=(now)=>{
    el._wave.elapsed+=now-el._wave.last;
    el._wave.last=now;
    bars.forEach(bar=>{
      const delay=Number(bar.dataset.delay || 0);
      const phase=((el._wave.elapsed-delay)%1200+1200)%1200/1200;
      const eased=(1-Math.cos(phase*Math.PI*2))/2;
      bar.style.height=`${(3+7*eased).toFixed(2)}px`;
    });
    el._wave.raf=requestAnimationFrame(tick);
  };
  const begin=()=>{
    el._wave.last=performance.now();
    el._wave.raf=requestAnimationFrame(tick);
    el.dataset.wavePaused='0';
  };
  if(el.dataset.wavePaused === '1'){
    el._wave.timer=setTimeout(begin, 180);
  }else{
    begin();
  }
}

function stopSoundWave(el){
  if(el._wave?.raf) cancelAnimationFrame(el._wave.raf);
  if(el._wave?.timer) clearTimeout(el._wave.timer);
  if(el._wave){ el._wave.raf=0; el._wave.timer=0; }
  el.dataset.wavePaused='1';
}

function initToolSwitcher(){
  const stage=vp.querySelector('.switcher-stage');
  if(!stage) return;
  const cards=[...stage.querySelectorAll('.switch-card')];
  const panels=[...vp.querySelectorAll('.switch-panel')];
  let active=Number(stage.dataset.active ?? 0);
  let open=stage.dataset.open==='1';
  const setActive=(index, shouldOpen=open)=>{
    active=(index+cards.length)%cards.length;
    open=shouldOpen;
    stage.dataset.active=String(active);
    stage.dataset.open=open?'1':'0';
    cards.forEach((card,i)=>{
      let pos=i-active;
      if(pos>cards.length/2) pos-=cards.length;
      if(pos<-cards.length/2) pos+=cards.length;
      card.dataset.pos=Math.abs(pos)>2?'hidden':String(pos);
      card.classList.toggle('on',i===active);
    });
    panels.forEach((panel,i)=>panel.classList.toggle('on',open&&i===active));
  };
  stage._setActive=setActive;
  setActive(active,false);
  cards.forEach((card)=>card.addEventListener('click',()=>setActive(Number(card.dataset.i || 0),true)));

  let wheelLock=0;
  stage.addEventListener('wheel',(e)=>{
    const vertical=Math.abs(e.deltaY)>=Math.abs(e.deltaX)*.55;
    if(!vertical) return;
    e.preventDefault();
    const now=performance.now();
    if(now-wheelLock<360||Math.abs(e.deltaY)<14) return;
    wheelLock=now;
    setActive(active+(e.deltaY>0?1:-1),open);
  },{passive:false});

  let dragStart=0;
  let dragMoved=false;
  stage.addEventListener('pointerdown',(e)=>{
    dragStart=e.clientY;
    dragMoved=false;
    stage.classList.add('dragging');
    stage.setPointerCapture?.(e.pointerId);
  });
  stage.addEventListener('pointermove',(e)=>{
    if(!stage.classList.contains('dragging')) return;
    dragMoved=Math.abs(e.clientY-dragStart)>8;
  });
  const finishDrag=(e)=>{
    if(!stage.classList.contains('dragging')) return;
    stage.classList.remove('dragging');
    const delta=e.clientY-dragStart;
    if(Math.abs(delta)>34) setActive(active+(delta<0?1:-1),open);
    if(dragMoved) e.preventDefault();
  };
  stage.addEventListener('pointerup',finishDrag);
  stage.addEventListener('pointercancel',()=>stage.classList.remove('dragging'));
}

function initOnboarding(){
  const root=vp.querySelector('[data-onboarding]');
  if(!root) return;
  const steps=[...root.querySelectorAll('.ob-step')];
  const panels=[...root.querySelectorAll('.ob-panel')];
  const progress=root.querySelector('#ob-progress');
  const title=root.querySelector('#ob-title');
  const setStep=(index)=>{
    const next=Math.max(0,Math.min(index,panels.length-1));
    steps.forEach((step,i)=>step.classList.toggle('on',i===next));
    panels.forEach((panel,i)=>panel.classList.toggle('on',i===next));
    if(progress) progress.textContent=`${next+1} / ${panels.length}`;
    if(title) title.textContent=steps[next]?.dataset.title || '';
    const width=panels[next]?.dataset.w;
    if(width) root.style.setProperty('--ob-w',`${width}px`);
  };
  steps.forEach(step=>step.addEventListener('click',()=>setStep(Number(step.dataset.ob || 0))));
  root.querySelectorAll('[data-ob-goto]').forEach(el=>el.addEventListener('click',()=>setStep(Number(el.dataset.obGoto || 0))));
  setStep(0);
}

let cur='settings';
const vp=document.getElementById('vp');
function render(){
  vp.innerHTML=P[cur]();
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.p===cur||(cur==='skinEditor'&&b.dataset.p==='skins')||(cur==='modDetail'&&b.dataset.p==='modManage')));
  vp.querySelectorAll('.nc').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
  vp.querySelectorAll('.seg').forEach(s=>{
    const buttons=[...s.querySelectorAll('button')];
    if(s.classList.contains('seg-motion')&&!s.dataset.active){
      s.dataset.active=String(Math.max(0,buttons.findIndex(b=>b.classList.contains('on'))));
    }
    buttons.forEach((b,i)=>b.addEventListener('click',()=>{
      buttons.forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if(s.classList.contains('seg-motion')) s.dataset.active=String(i);
    }));
  });
  vp.querySelectorAll('.sound-wave.on').forEach(startSoundWave);
  initToolSwitcher();
  initOnboarding();
  animateDailyCounts();
}
function animateDailyCounts(){
  const nums = [...vp.querySelectorAll('.count-num')]
    .sort((a, b) => Number(a.dataset.order || 0) - Number(b.dataset.order || 0));
  nums.forEach((el, i) => {
    const target = Number(el.dataset.value || 0);
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    const duration = 360 + i * 45;
    const start = performance.now() + 140 + i * 85;
    el.classList.add('counting');
    el.classList.remove('done');
    el.textContent = `${prefix}0${suffix}`;
    function tick(now){
      if (!document.body.contains(el)) return;
      const t = Math.max(0, Math.min(1, (now - start) / duration));
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = `${prefix}${Math.round(target * eased)}${suffix}`;
      if (t < 1) requestAnimationFrame(tick);
      else {
        el.classList.remove('counting');
        el.classList.add('done');
      }
    }
    requestAnimationFrame(tick);
  });
}
