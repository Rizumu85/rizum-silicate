<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procreate Viewer - Dynamic Settings Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background-color: #0a0a0a; 
            background-image: radial-gradient(#222 1px, transparent 1px); 
            background-size: 24px 24px; 
            color: white; 
        }
        .glass { 
            background: rgba(20, 20, 20, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08); 
        }
        
        ::-webkit-scrollbar { height: 6px; width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        /* Floating Panel */
        #export-panel {
            position: absolute;
            bottom: 6rem;
            right: 1.5rem;
            transform: translateY(20px) scale(0.95);
            transform-origin: bottom right;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
        }
        #export-panel.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #4b5563; 
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans relative">

    <!-- TOP LEFT: Open Button & Title -->
    <div class="absolute top-6 left-6 z-50 flex items-center gap-2">
        <button class="glass p-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition shadow-lg" title="Open File">
            <i data-lucide="folder-open" class="w-5 h-5"></i>
        </button>
        <div class="glass px-4 py-2.5 rounded-xl flex items-center gap-3 shadow-lg">
            <i data-lucide="brush" class="w-4 h-4 text-blue-400"></i>
            <h2 class="text-sm font-medium tracking-wide text-gray-200">Animation_Sequence.procreate</h2>
        </div>
    </div>

    <!-- MAIN CANVAS AREA -->
    <div class="absolute inset-0 flex items-center justify-center p-8 z-0">
        <div id="canvas-wrapper" class="w-full h-full max-w-5xl max-h-[85vh] bg-[#151515] rounded-2xl shadow-2xl border border-gray-800/80 transition-transform duration-500 relative overflow-hidden flex items-center justify-center cursor-move">
            <div id="art-content" class="flex flex-col items-center text-gray-700 transition-transform duration-300">
                <i data-lucide="image" class="w-32 h-32 mb-4 opacity-20"></i>
                <h3 class="text-lg font-medium uppercase tracking-widest opacity-30">Artwork</h3>
            </div>
        </div>
    </div>

    <!-- REFINED EXPORT PANEL WITH DYNAMIC SETTINGS -->
    <div id="export-panel" class="glass w-[320px] rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[75vh]">
        
        <!-- VIEW 1: EXPORT FORMAT LIST -->
        <div id="export-list-view" class="flex flex-col h-full">
            <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
                <span class="font-medium text-sm text-gray-200 flex items-center gap-2"><i data-lucide="share" class="w-4 h-4 text-gray-400"></i> Export As</span>
                <button onclick="toggleExportPanel()" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-2 flex flex-col overflow-y-auto pb-4">
                
                <!-- Category: Animation -->
                <div class="px-3 py-1.5 mt-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Animation</div>
                
                <button onclick="showExportSettings('MP4 / HEVC')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="video" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">MP4 / HEVC</div>
                        <div class="text-xs text-gray-500">Standard video formats</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
                
                <button onclick="showExportSettings('PNG Sequence')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="layers" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">PNG Sequence</div>
                        <div class="text-xs text-gray-500">Zip folder of all frames</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
                
                <button onclick="showExportSettings('Animated GIF')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="file-video" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">Animated GIF</div>
                        <div class="text-xs text-gray-500">Web-friendly format</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
                
            </div>
        </div>

        <!-- VIEW 2: DYNAMIC SETTINGS FORM -->
        <div id="export-settings-view" class="hidden flex-col h-full bg-black/20">
            <!-- Header -->
            <div class="px-4 py-3 border-b border-gray-800 flex items-center bg-white/5 gap-3">
                <button onclick="hideExportSettings()" class="text-gray-400 hover:text-white transition bg-white/5 p-1 rounded-md"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span id="export-settings-title" class="font-medium text-sm text-gray-200 flex-1 text-center pr-8">Settings</span>
            </div>
            
            <!-- Dynamic Controls Container -->
            <div id="dynamic-controls" class="p-5 flex flex-col gap-6 overflow-y-auto">
                <!-- JS will inject sliders, toggles, and choices here -->
            </div>

            <!-- Action Footer -->
            <div class="p-4 border-t border-gray-800 bg-white/5">
                <button onclick="alert('Export started!')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="share" class="w-4 h-4"></i> Export Now
                </button>
            </div>
        </div>

    </div>

    <!-- THE PILL DOCK -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 glass rounded-full p-1.5 flex items-center gap-1 shadow-2xl z-50">
        <button class="btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2">
            <i data-lucide="maximize" class="w-4 h-4"></i><span>Canvas</span>
        </button>
        <button id="btn-export" onclick="toggleExportPanel()" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2">
            <i data-lucide="share" class="w-4 h-4"></i><span>Export</span>
        </button>
    </div>

    <script>
        lucide.createIcons();

        function toggleExportPanel() {
            const panel = document.getElementById('export-panel');
            const btn = document.getElementById('btn-export');
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
                btn.classList.replace('bg-white', 'text-gray-300');
                btn.classList.replace('text-black', 'hover:bg-white/10');
            } else {
                panel.classList.add('active');
                btn.classList.add('bg-white', 'text-black');
                btn.classList.remove('text-gray-300', 'hover:bg-white/10');
            }
        }

        // ==========================================
        // DYNAMIC SETTINGS DATA & RENDERER
        // ==========================================
        
        // These reflect the exact parameters from src/procreate_reader.py
        const FORMAT_SETTINGS = {
            'MP4 / HEVC': [
                { type: 'choice', id: 'codec', label: 'Codec', options: ['MP4', 'HEVC'], val: 'MP4' },
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'toggle', id: 'max_res', label: 'Full Resolution', val: true, desc: 'Highest available dimensions' },
                { type: 'toggle', id: 'transparent', label: 'Transparent Background', val: false, desc: 'May require HEVC depending on ffmpeg' },
            ],
            'PNG Sequence': [
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'toggle', id: 'max_res', label: 'Full Resolution', val: true, desc: 'Highest available dimensions' },
                { type: 'toggle', id: 'transparent', label: 'Transparent Background', val: true },
                { type: 'toggle', id: 'expand_holds', label: 'Expand Held Frames', val: true, desc: 'Creates duplicate PNGs for holds' },
            ],
            'Animated GIF': [
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'toggle', id: 'max_res', label: 'Full Resolution', val: true, desc: 'Highest available dimensions' },
                { type: 'toggle', id: 'transparent', label: 'Transparent Background', val: false },
                { type: 'toggle', id: 'dither', label: 'Dithering', val: true, desc: 'Reduces color banding' },
                { type: 'toggle', id: 'per_frame_palette', label: 'Per-frame Palette', val: true, desc: 'Better colors, larger file size' },
                { type: 'slider', id: 'alpha_threshold', label: 'Alpha Threshold', min: 0, max: 255, val: 128, desc: 'Transparency cutoff level' },
            ]
        };

        function showExportSettings(formatTitle) {
            document.getElementById('export-list-view').classList.add('hidden');
            document.getElementById('export-settings-view').classList.remove('hidden');
            document.getElementById('export-settings-view').classList.add('flex');
            document.getElementById('export-settings-title').innerText = formatTitle;

            renderDynamicSettings(formatTitle);
        }

        function hideExportSettings() {
            document.getElementById('export-settings-view').classList.add('hidden');
            document.getElementById('export-settings-view').classList.remove('flex');
            document.getElementById('export-list-view').classList.remove('hidden');
        }

        function renderDynamicSettings(formatTitle) {
            const container = document.getElementById('dynamic-controls');
            container.innerHTML = ''; // Clear old

            const settings = FORMAT_SETTINGS[formatTitle];
            if (!settings) return;

            let togglesContainerHtml = '<div class="flex flex-col gap-4">';
            let hasToggles = false;

            settings.forEach(setting => {
                if (setting.type === 'choice') {
                    // Choice Toggle (e.g. MP4 vs HEVC)
                    const btns = setting.options.map(opt => `
                        <button onclick="updateChoice('${setting.id}', this)" class="${opt === setting.val ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'} px-3 py-1.5 rounded-md shadow-sm transition flex-1">${opt}</button>
                    `).join('');
                    
                    container.innerHTML += `
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block">${setting.label}</label>
                            <div class="flex bg-black/50 p-1 rounded-lg text-sm border border-white/5" id="${setting.id}-group">
                                ${btns}
                            </div>
                        </div>
                    `;
                } 
                else if (setting.type === 'slider') {
                    // Range Slider
                    const descHtml = setting.desc ? `<div class="text-[10px] text-gray-500 mb-2 mt-[-4px]">${setting.desc}</div>` : '';
                    container.innerHTML += `
                        <div>
                            <div class="flex justify-between items-end mb-2">
                                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block">${setting.label}</label>
                                <span id="val-${setting.id}" class="text-sm font-mono text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded">${setting.val}</span>
                            </div>
                            ${descHtml}
                            <input type="range" id="${setting.id}" min="${setting.min}" max="${setting.max}" value="${setting.val}" oninput="document.getElementById('val-${setting.id}').innerText = this.value">
                            <div class="flex justify-between text-[10px] text-gray-600 mt-1 font-mono">
                                <span>${setting.min}</span><span>${setting.max}</span>
                            </div>
                        </div>
                    `;
                } 
                else if (setting.type === 'toggle') {
                    // Toggle Switch (group them together visually)
                    hasToggles = true;
                    const descHtml = setting.desc ? `<div class="text-xs text-gray-500">${setting.desc}</div>` : '';
                    const bgClass = setting.val ? 'bg-blue-500' : 'bg-gray-600';
                    const dotClass = setting.val ? 'translate-x-5' : 'translate-x-0';
                    
                    togglesContainerHtml += `
                        <label class="flex items-center cursor-pointer justify-between group">
                            <div>
                                <div class="text-sm font-medium text-gray-200 group-hover:text-white transition">${setting.label}</div>
                                ${descHtml}
                            </div>
                            <div class="relative ml-4 flex-shrink-0" onclick="toggleSwitch(this); event.preventDefault();">
                                <div class="bg-layer block ${bgClass} w-11 h-6 rounded-full transition-colors duration-300"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 transform ${dotClass}"></div>
                            </div>
                        </label>
                    `;
                }
            });

            if (hasToggles) {
                togglesContainerHtml += '</div>';
                container.innerHTML += togglesContainerHtml;
            }
        }

        // Helpers for dynamic controls
        function updateChoice(groupId, clickedBtn) {
            const group = document.getElementById(groupId + '-group');
            const btns = group.querySelectorAll('button');
            btns.forEach(btn => {
                btn.className = "text-gray-400 hover:text-white px-3 py-1.5 rounded-md transition flex-1";
            });
            clickedBtn.className = "bg-gray-700 text-white px-3 py-1.5 rounded-md shadow-sm transition flex-1";
        }

        function toggleSwitch(el) {
            const dot = el.querySelector('.dot');
            const bg = el.querySelector('.bg-layer');
            if (bg.classList.contains('bg-blue-500')) {
                bg.classList.remove('bg-blue-500'); bg.classList.add('bg-gray-600');
                dot.classList.remove('translate-x-5'); dot.classList.add('translate-x-0');
            } else {
                bg.classList.remove('bg-gray-600'); bg.classList.add('bg-blue-500');
                dot.classList.remove('translate-x-0'); dot.classList.add('translate-x-5');
            }
        }
    </script>
</body>
</html>
