<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procreate Viewer - Seamless Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background-color: #0a0a0a; 
            background-image: radial-gradient(#222 1px, transparent 1px); 
            background-size: 24px 24px; 
            color: white; 
        }
        .glass { 
            background: rgba(20, 20, 20, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08); 
        }
        
        ::-webkit-scrollbar { height: 6px; width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        /* Floating Panels */
        .side-panel {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
        }
        #layers-panel { right: 1.5rem; top: 50%; transform: translateY(-50%) translateX(20px); }
        #layers-panel.active { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }

        #info-panel { right: 1.5rem; top: 1.5rem; transform: translateY(-20px); }
        #info-panel.active { opacity: 1; transform: translateY(0); pointer-events: auto; }

        #export-panel {
            bottom: 6rem;
            right: 1.5rem;
            transform: translateY(20px) scale(0.95);
            transform-origin: bottom right;
        }
        #export-panel.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Simplified Playback Panel */
        #playback-container {
            position: absolute;
            bottom: 5.5rem; 
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
            display: flex;
            flex-col;
            align-items: center;
            gap: 0.5rem;
        }
        #playback-container.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* Ultra Minimal Frame Thumbnails */
        .frame-thumb {
            width: 28px;
            height: 40px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0.6;
            transition: all 0.2s;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }
        .frame-thumb:hover { opacity: 0.9; }
        .frame-thumb.active {
            opacity: 1;
            border-color: #3b82f6;
            background-color: rgba(255,255,255,0.15);
            transform: scale(1.1);
            z-index: 10;
        }

        /* Custom Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #ffffff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans relative">

    <div class="absolute top-6 left-6 z-50 flex items-center gap-2">
        <button class="glass p-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition shadow-lg" title="Open File">
            <i data-lucide="folder-open" class="w-5 h-5"></i>
        </button>
        <div class="glass px-4 py-2.5 rounded-xl flex items-center gap-3 shadow-lg">
            <i data-lucide="brush" class="w-4 h-4 text-blue-400"></i>
            <h2 class="text-sm font-medium tracking-wide text-gray-200">Animation_Sequence.procreate</h2>
        </div>
    </div>

    <!-- MAIN CANVAS AREA -->
    <div class="absolute inset-0 flex items-center justify-center p-8 z-0">
        <div id="canvas-wrapper" class="w-full h-full max-w-5xl max-h-[85vh] bg-[#151515] rounded-2xl shadow-2xl border border-gray-800/80 transition-transform duration-500 relative overflow-hidden flex items-center justify-center cursor-move">
            <div id="art-content" class="flex flex-col items-center text-gray-700 transition-transform duration-300">
                <i data-lucide="image" class="w-32 h-32 mb-4 opacity-20"></i>
                <h3 class="text-lg font-medium uppercase tracking-widest opacity-30">Artwork</h3>
            </div>
            <div class="absolute bottom-1.5 right-1.5 flex gap-0.5 z-10">
                <button onclick="resetCanvasView()" class="glass p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition shadow-lg" title="Fit Canvas to Screen">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- LAYERS PANEL (Independent) -->
    <div id="layers-panel" class="side-panel glass w-72 rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[60vh]">
        <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
            <span class="font-medium text-sm text-gray-200">Layers</span>
            <button class="text-gray-400 hover:text-white transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div class="p-2 flex flex-col gap-1 overflow-y-auto">
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer">
                <i data-lucide="eye" class="w-4 h-4 text-blue-400"></i>
                <div class="w-8 h-8 bg-pink-500/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-200">Highlights</span>
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer">
                <i data-lucide="eye" class="w-4 h-4 text-blue-400"></i>
                <div class="w-8 h-8 bg-blue-500/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-200">Character Base</span>
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer opacity-40">
                <i data-lucide="eye-off" class="w-4 h-4 text-gray-500"></i>
                <div class="w-8 h-8 bg-gray-600/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-400">Sketch</span>
            </div>
        </div>
    </div>

    <!-- INFO PANEL (Independent) -->
    <div id="info-panel" class="side-panel glass w-72 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
            <span class="font-medium text-sm text-gray-200 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> Details</span>
            <button onclick="togglePanel('info')" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-3 text-sm text-gray-400">
            <div class="flex justify-between"><span>Resolution</span> <span class="text-gray-200">1920 x 1080 px</span></div>
            <div class="flex justify-between"><span>Frames</span> <span class="text-gray-200">24</span></div>
            <div class="flex justify-between"><span>Total Layers</span> <span class="text-gray-200">12</span></div>
            <div class="flex justify-between"><span>File Size</span> <span class="text-gray-200">45 MB</span></div>
        </div>
    </div>

    <!-- REFINED EXPORT PANEL WITH DYNAMIC SETTINGS -->
    <div id="export-panel" class="side-panel glass w-[320px] rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[75vh]">
        <!-- VIEW 1: EXPORT FORMAT LIST -->
        <div id="export-list-view" class="flex flex-col h-full">
            <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
                <span class="font-medium text-sm text-gray-200 flex items-center gap-2"><i data-lucide="share" class="w-4 h-4 text-gray-400"></i> Export As</span>
                <button onclick="togglePanel('export')" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-2 flex flex-col overflow-y-auto pb-4">
                <div class="px-3 py-1.5 mt-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Animation</div>
                
                <button onclick="showExportSettings('MP4 / HEVC')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="video" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">MP4 / HEVC</div>
                        <div class="text-xs text-gray-500">Standard video formats</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
                
                <button onclick="showExportSettings('PNG Sequence')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="layers" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">PNG Sequence</div>
                        <div class="text-xs text-gray-500">Zip folder of all frames</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
                
                <button onclick="showExportSettings('Animated GIF')" class="flex items-center gap-3 p-2.5 hover:bg-white/10 rounded-xl text-left transition group">
                    <div class="p-1.5 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500/20 transition"><i data-lucide="file-video" class="w-4 h-4"></i></div>
                    <div class="flex-1">
                        <div class="text-sm font-medium text-gray-200">Animated GIF</div>
                        <div class="text-xs text-gray-500">Web-friendly format</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-gray-400"></i>
                </button>
            </div>
        </div>

        <!-- VIEW 2: DYNAMIC SETTINGS FORM -->
        <div id="export-settings-view" class="hidden flex-col h-full bg-black/20">
            <div class="px-4 py-3 border-b border-gray-800 flex items-center bg-white/5 gap-3">
                <button onclick="hideExportSettings()" class="text-gray-400 hover:text-white transition bg-white/5 p-1 rounded-md"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span id="export-settings-title" class="font-medium text-sm text-gray-200 flex-1 text-center pr-8">Settings</span>
            </div>
            <div id="dynamic-controls" class="p-5 flex flex-col gap-6 overflow-y-auto"></div>
            <div class="p-4 border-t border-gray-800 bg-white/5">
                <button onclick="alert('Export started!')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="share" class="w-4 h-4"></i> Export Now
                </button>
            </div>
        </div>
    </div>

    <!-- SIMPLIFIED PLAYBACK PANEL -->
    <div id="playback-container" class="flex flex-col items-center">
        <!-- Mode Switch Floating Above -->
        <div class="flex bg-black/60 backdrop-blur-md p-1 rounded-full text-xs border border-white/10 shadow-lg mb-2">
            <button id="mode-animation" onclick="setPlaybackMode('animation')" class="bg-blue-600 text-white px-4 py-1 rounded-full shadow-sm transition">Animation</button>
            <button id="mode-timelapse" onclick="setPlaybackMode('timelapse')" class="text-gray-300 hover:text-white px-4 py-1 rounded-full transition">Time-lapse</button>
        </div>

        <!-- The Minimal Track Panel -->
        <div class="glass rounded-2xl p-1.5 shadow-2xl flex items-center gap-2 border border-white/10 max-w-[90vw]">
            
            <!-- Universal Play Button -->
            <button onclick="togglePlay()" class="w-10 h-10 flex-shrink-0 bg-white/10 hover:bg-white/20 text-white rounded-xl flex items-center justify-center transition-colors">
                <i data-lucide="play" id="play-icon-tl" class="w-5 h-5 fill-current"></i>
                <i data-lucide="pause" id="pause-icon-tl" class="w-5 h-5 fill-current hidden"></i>
            </button>

            <!-- Mode 1: Animation Filmstrip -->
            <div id="animation-track" class="flex items-center flex-1 overflow-hidden relative px-1">
                <div class="flex gap-1 overflow-x-auto scroll-smooth py-1" id="frame-track" style="max-width: 600px;">
                    <!-- JS Populated Thumbnails -->
                </div>
            </div>

            <!-- Mode 2: Time-lapse Scrubber -->
            <div id="timelapse-track" class="hidden items-center gap-3 px-3 flex-1 w-[400px]">
                <span id="current-time" class="text-xs text-gray-400 font-mono w-10 text-right">00:00</span>
                <div class="flex-1 h-1.5 bg-gray-800 rounded-full overflow-hidden cursor-pointer group relative border border-gray-700" onclick="seek(event)">
                    <div id="progress-bar" class="absolute left-0 top-0 bottom-0 w-[0%] bg-blue-500 rounded-full transition-all duration-75 group-hover:bg-blue-400"></div>
                </div>
                <span id="total-time" class="text-xs text-gray-400 font-mono w-10">02:45</span>
            </div>

            <!-- Frame Counter (Anim Mode only) -->
            <div id="frame-counter" class="w-12 text-center text-xs font-mono text-gray-400 pr-2">1/24</div>
        </div>
    </div>

    <!-- THE PILL DOCK -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 glass rounded-full p-1.5 flex items-center gap-1 shadow-2xl z-50">
        <button id="btn-canvas" onclick="togglePanel('none')" class="btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2">
            <i data-lucide="maximize" class="w-4 h-4"></i><span>Canvas</span>
        </button>
        <!-- Independent Toggle for Layers -->
        <button id="btn-layers" onclick="togglePanel('layers')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4"></i><span>Layers</span>
        </button>
        <!-- Independent Toggle for Playback -->
        <button id="btn-playback" onclick="togglePanel('playback')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2">
            <i data-lucide="video" class="w-4 h-4"></i><span>Playback</span>
        </button>
        <button id="btn-info" onclick="togglePanel('info')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4"></i><span>Info</span>
        </button>
        <div class="w-px h-6 bg-gray-700 mx-1"></div>
        <button id="btn-export" onclick="togglePanel('export')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2">
            <i data-lucide="share" class="w-4 h-4"></i><span>Export</span>
        </button>
    </div>

    <script>
        lucide.createIcons();

        function resetCanvasView() {
            const artContent = document.getElementById('art-content');
            artContent.style.transform = `scale(1) translate(0px, 0px)`;
            const fitBtn = document.querySelector('button[title="Fit Canvas to Screen"]');
            const originalClass = fitBtn.className;
            fitBtn.className = "glass p-2 rounded-lg bg-white/20 text-white transition shadow-lg";
            setTimeout(() => { fitBtn.className = originalClass; }, 200);
        }

        // ==========================================
        // INDEPENDENT PANEL LOGIC
        // ==========================================
        function togglePanel(type) {
            const panels = {
                layers: document.getElementById('layers-panel'),
                info: document.getElementById('info-panel'),
                export: document.getElementById('export-panel'),
                playback: document.getElementById('playback-container')
            };
            const btns = {
                layers: document.getElementById('btn-layers'),
                playback: document.getElementById('btn-playback'),
                info: document.getElementById('btn-info'),
                export: document.getElementById('btn-export'),
                canvas: document.getElementById('btn-canvas')
            };

            // If "Canvas" clicked, close everything
            if (type === 'none') {
                Object.values(panels).forEach(p => p.classList.remove('active'));
                ['layers', 'playback', 'info', 'export'].forEach(id => {
                    btns[id].className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                });
                btns.canvas.className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
                return;
            }

            // Info and Export are mutually exclusive with each other and Layers (to prevent too much clutter)
            // BUT Layers and Playback can be open together.
            if (type === 'info' || type === 'export') {
                if (panels[type].classList.contains('active')) {
                    panels[type].classList.remove('active');
                    btns[type].className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                } else {
                    // Close others that might conflict
                    panels.info.classList.remove('active');
                    panels.export.classList.remove('active');
                    panels.layers.classList.remove('active'); // Close layers to make room for export/info
                    
                    btns.info.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                    btns.export.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                    btns.layers.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";

                    panels[type].classList.add('active');
                    btns[type].className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
                }
            } 
            else if (type === 'layers' || type === 'playback') {
                // Independent toggle for layers & playback
                if (panels[type].classList.contains('active')) {
                    panels[type].classList.remove('active');
                    btns[type].className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                } else {
                    // Close info/export if opening layers
                    if (type === 'layers') {
                        panels.info.classList.remove('active');
                        panels.export.classList.remove('active');
                        btns.info.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                        btns.export.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
                    }
                    panels[type].classList.add('active');
                    btns[type].className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
                }
            }

            // Check if ANY panel is active. If so, unhighlight Canvas.
            const anyActive = Object.values(panels).some(p => p.classList.contains('active'));
            if (anyActive) {
                btns.canvas.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 transition-all flex items-center gap-2";
            } else {
                btns.canvas.className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
            }
        }

        // ==========================================
        // DYNAMIC SETTINGS DATA & RENDERER
        // ==========================================
        const FORMAT_SETTINGS = {
            'MP4 / HEVC': [
                { type: 'choice', id: 'codec', label: 'Codec', options: ['MP4', 'HEVC'], val: 'MP4' },
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'choice', id: 'max_res', label: 'Resolution', options: ['Full', 'Standard'], val: 'Full', desc: 'Output dimensions' },
                // NO transparent toggle for MP4
            ],
            'PNG Sequence': [
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'choice', id: 'max_res', label: 'Resolution', options: ['Full', 'Standard'], val: 'Full' },
                { type: 'toggle', id: 'transparent', label: 'Transparent Background', val: true },
                { type: 'toggle', id: 'expand_holds', label: 'Expand Held Frames', val: true, desc: 'Duplicates PNGs for held frames' },
            ],
            'Animated GIF': [
                { type: 'slider', id: 'fps', label: 'Frames Per Second', min: 1, max: 60, val: 15 },
                { type: 'choice', id: 'max_res', label: 'Resolution', options: ['Full', 'Standard'], val: 'Full' },
                { type: 'toggle', id: 'transparent', label: 'Transparent Background', val: false },
                { type: 'toggle', id: 'dither', label: 'Dithering', val: true },
                { type: 'toggle', id: 'per_frame_palette', label: 'Per-frame Palette', val: true },
                { type: 'slider', id: 'alpha_threshold', label: 'Alpha Threshold', min: 0, max: 255, val: 128 },
            ]
        };

        function showExportSettings(formatTitle) {
            document.getElementById('export-list-view').classList.add('hidden');
            document.getElementById('export-settings-view').classList.remove('hidden');
            document.getElementById('export-settings-view').classList.add('flex');
            document.getElementById('export-settings-title').innerText = formatTitle;
            renderDynamicSettings(formatTitle);
        }

        function hideExportSettings() {
            document.getElementById('export-settings-view').classList.add('hidden');
            document.getElementById('export-settings-view').classList.remove('flex');
            document.getElementById('export-list-view').classList.remove('hidden');
        }

        function renderDynamicSettings(formatTitle) {
            const container = document.getElementById('dynamic-controls');
            container.innerHTML = ''; 

            const settings = FORMAT_SETTINGS[formatTitle];
            if (!settings) return;

            let togglesContainerHtml = '<div class="flex flex-col gap-4">';
            let hasToggles = false;

            settings.forEach(setting => {
                if (setting.type === 'choice') {
                    const descHtml = setting.desc ? `<div class="text-[10px] text-gray-500 mb-1">${setting.desc}</div>` : '';
                    const btns = setting.options.map(opt => `
                        <button onclick="updateChoice('${setting.id}', this)" class="${opt === setting.val ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'} px-3 py-1.5 rounded-md shadow-sm transition flex-1 text-xs font-medium">${opt}</button>
                    `).join('');
                    
                    container.innerHTML += `
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block">${setting.label}</label>
                            ${descHtml}
                            <div class="flex bg-black/50 p-1 rounded-lg border border-white/5 mt-1" id="${setting.id}-group">
                                ${btns}
                            </div>
                        </div>
                    `;
                } 
                else if (setting.type === 'slider') {
                    const descHtml = setting.desc ? `<div class="text-[10px] text-gray-500 mb-2 mt-[-4px]">${setting.desc}</div>` : '';
                    container.innerHTML += `
                        <div>
                            <div class="flex justify-between items-end mb-2">
                                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block">${setting.label}</label>
                                <span id="val-${setting.id}" class="text-sm font-mono text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded">${setting.val}</span>
                            </div>
                            ${descHtml}
                            <input type="range" id="${setting.id}" min="${setting.min}" max="${setting.max}" value="${setting.val}" oninput="document.getElementById('val-${setting.id}').innerText = this.value">
                            <div class="flex justify-between text-[10px] text-gray-600 mt-1 font-mono">
                                <span>${setting.min}</span><span>${setting.max}</span>
                            </div>
                        </div>
                    `;
                } 
                else if (setting.type === 'toggle') {
                    hasToggles = true;
                    const descHtml = setting.desc ? `<div class="text-xs text-gray-500">${setting.desc}</div>` : '';
                    const bgClass = setting.val ? 'bg-blue-500' : 'bg-gray-600';
                    const dotClass = setting.val ? 'translate-x-5' : 'translate-x-0';
                    
                    togglesContainerHtml += `
                        <label class="flex items-center cursor-pointer justify-between group">
                            <div>
                                <div class="text-sm font-medium text-gray-200 group-hover:text-white transition">${setting.label}</div>
                                ${descHtml}
                            </div>
                            <div class="relative ml-4 flex-shrink-0" onclick="toggleSwitch(this); event.preventDefault();">
                                <div class="bg-layer block ${bgClass} w-11 h-6 rounded-full transition-colors duration-300"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 transform ${dotClass}"></div>
                            </div>
                        </label>
                    `;
                }
            });

            if (hasToggles) {
                togglesContainerHtml += '</div>';
                container.innerHTML += togglesContainerHtml;
            }
        }

        function updateChoice(groupId, clickedBtn) {
            const group = document.getElementById(groupId + '-group');
            const btns = group.querySelectorAll('button');
            btns.forEach(btn => { btn.className = "text-gray-400 hover:text-white px-3 py-1.5 rounded-md transition flex-1 text-xs font-medium"; });
            clickedBtn.className = "bg-gray-700 text-white px-3 py-1.5 rounded-md shadow-sm transition flex-1 text-xs font-medium";
        }

        function toggleSwitch(el) {
            const dot = el.querySelector('.dot');
            const bg = el.querySelector('.bg-layer');
            if (bg.classList.contains('bg-blue-500')) {
                bg.classList.remove('bg-blue-500'); bg.classList.add('bg-gray-600');
                dot.classList.remove('translate-x-5'); dot.classList.add('translate-x-0');
            } else {
                bg.classList.remove('bg-gray-600'); bg.classList.add('bg-blue-500');
                dot.classList.remove('translate-x-0'); dot.classList.add('translate-x-5');
            }
        }

        // ==========================================
        // SIMPLIFIED PLAYBACK LOGIC
        // ==========================================
        const TOTAL_FRAMES = 24;
        let currentFrame = 1;
        let isPlaying = false;
        let playInterval;
        let currentMode = 'animation';
        let timelapseProgress = 0;

        const track = document.getElementById('frame-track');
        const counter = document.getElementById('frame-counter');

        for (let i = 1; i <= TOTAL_FRAMES; i++) {
            const thumb = document.createElement('div');
            thumb.className = 'frame-thumb';
            thumb.style.backgroundImage = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"28\" height=\"40\" viewBox=\"0 0 32 48\"><circle cx=\"16\" cy=\"16\" r=\"5\" fill=\"none\" stroke=\"%23888\" stroke-width=\"2\"/><path d=\"M16 21 L16 34 M16 24 L8 28 M16 24 L24 28 M16 34 L10 42 M16 34 L22 42\" stroke=\"%23888\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>')";
            thumb.dataset.frame = i;
            thumb.onclick = () => { if(currentMode==='animation') setFrame(i); };
            track.appendChild(thumb);
        }

        function setPlaybackMode(mode) {
            currentMode = mode;
            const btnAnim = document.getElementById('mode-animation');
            const btnTime = document.getElementById('mode-timelapse');
            const trackAnim = document.getElementById('animation-track');
            const trackTime = document.getElementById('timelapse-track');

            if(isPlaying) togglePlay();

            if (mode === 'animation') {
                btnAnim.className = "bg-blue-600 text-white px-4 py-1 rounded-full shadow-sm transition";
                btnTime.className = "text-gray-300 hover:text-white px-4 py-1 rounded-full transition";
                
                trackAnim.classList.remove('hidden');
                trackTime.classList.add('hidden');
                counter.classList.remove('hidden');
                setFrame(currentFrame);
            } else {
                btnTime.className = "bg-blue-600 text-white px-4 py-1 rounded-full shadow-sm transition";
                btnAnim.className = "text-gray-300 hover:text-white px-4 py-1 rounded-full transition";
                
                trackAnim.classList.add('hidden');
                trackTime.classList.remove('hidden');
                trackTime.classList.add('flex');
                counter.classList.add('hidden');
                updateTimelapseUI();
            }
        }

        function setFrame(frameNum) {
            currentFrame = frameNum;
            Array.from(track.children).forEach(child => {
                child.classList.remove('active');
                if (parseInt(child.dataset.frame) === currentFrame) {
                    child.classList.add('active');
                    child.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
            counter.innerText = `${currentFrame}/${TOTAL_FRAMES}`;
        }

        function updateTimelapseUI() {
            document.getElementById('progress-bar').style.width = `${timelapseProgress}%`;
            const totalSeconds = Math.floor((timelapseProgress / 100) * 165);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('current-time').innerText = `0${mins}:${secs < 10 ? '0'+secs : secs}`;
        }

        function seek(event) {
            const scrubber = event.currentTarget;
            const rect = scrubber.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            timelapseProgress = (clickX / rect.width) * 100;
            updateTimelapseUI();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-icon-tl').classList.toggle('hidden', isPlaying);
            document.getElementById('pause-icon-tl').classList.toggle('hidden', !isPlaying);

            if (isPlaying) {
                if (currentMode === 'animation') {
                    playInterval = setInterval(() => {
                        let next = currentFrame + 1;
                        if (next > TOTAL_FRAMES) next = 1;
                        setFrame(next);
                    }, 1000 / 12);
                } else {
                    playInterval = setInterval(() => {
                        timelapseProgress += 0.5;
                        if (timelapseProgress >= 100) {
                            timelapseProgress = 100;
                            togglePlay();
                        }
                        updateTimelapseUI();
                    }, 50);
                }
            } else {
                clearInterval(playInterval);
            }
        }

        setFrame(1);
    </script>
</body>
</html>
