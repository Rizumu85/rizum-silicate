<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procreate Viewer - Final Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background-color: #0a0a0a; 
            background-image: radial-gradient(#222 1px, transparent 1px); 
            background-size: 24px 24px; 
            color: white; 
        }
        /* Unified Dark Glass Theme */
        .glass { 
            background: rgba(20, 20, 20, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08); 
        }
        
        ::-webkit-scrollbar { height: 6px; width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        /* Floating Panel Animations */
        .side-panel {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
        }
        #layers-panel { right: 1.5rem; top: 50%; transform: translateY(-50%) translateX(20px); }
        #layers-panel.active { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }

        #info-panel { right: 1.5rem; top: 1.5rem; transform: translateY(-20px); }
        #info-panel.active { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /* Playback Panel (Bottom sliding up) */
        #playback-container {
            position: absolute;
            bottom: 6rem; /* Above the dock */
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 40;
        }
        #playback-container.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* Frame Thumbnails */
        .frame-thumb {
            width: 32px;
            height: 48px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 6px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0.5;
            transition: all 0.2s;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }
        .frame-thumb:hover { opacity: 0.8; }
        .frame-thumb.active {
            opacity: 1;
            border-color: #3b82f6;
            transform: scale(1.05);
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans relative">

    <!-- TOP LEFT: Open Button & Title -->
    <div class="absolute top-6 left-6 z-50 flex items-center gap-2">
        <button class="glass p-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition shadow-lg" title="Open File" onclick="alert('File picker dialog would open here!')">
            <i data-lucide="folder-open" class="w-5 h-5"></i>
        </button>
        <div class="glass px-4 py-2.5 rounded-xl flex items-center gap-3 shadow-lg">
            <i data-lucide="brush" class="w-4 h-4 text-blue-400"></i>
            <h2 class="text-sm font-medium tracking-wide text-gray-200">Animation_Sequence.procreate</h2>
        </div>
    </div>

    <!-- MAIN CANVAS AREA (Centered, allowed to be covered slightly) -->
    <div class="absolute inset-0 flex items-center justify-center p-8 z-0">
        <div class="w-full h-full max-w-5xl max-h-[85vh] bg-[#151515] rounded-2xl shadow-2xl flex items-center justify-center border border-gray-800/80 transition-all hover:scale-[1.01] duration-700 relative overflow-hidden">
            <div class="flex flex-col items-center text-gray-700">
                <i data-lucide="image" class="w-24 h-24 mb-4 opacity-20"></i>
                <h3 class="text-sm font-medium uppercase tracking-widest opacity-30">Artwork Canvas</h3>
            </div>
            <!-- Frame overlay text for Animation mode -->
            <div id="canvas-frame-text" class="absolute bottom-6 right-8 text-5xl font-black text-white/5 pointer-events-none opacity-0 transition-opacity">
                1
            </div>
        </div>
    </div>

    <!-- FLOATING INFO PANEL (Top Right) -->
    <div id="info-panel" class="side-panel glass w-72 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
            <span class="font-medium text-sm text-gray-200 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> Details</span>
            <button onclick="togglePanel('info')" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-3 text-sm text-gray-400">
            <div class="flex justify-between"><span>Resolution</span> <span class="text-gray-200">1920 x 1080 px</span></div>
            <div class="flex justify-between"><span>Frames</span> <span class="text-gray-200">24</span></div>
            <div class="flex justify-between"><span>Total Layers</span> <span class="text-gray-200">12</span></div>
            <div class="flex justify-between"><span>File Size</span> <span class="text-gray-200">45 MB</span></div>
        </div>
    </div>

    <!-- FLOATING LAYERS PANEL (Right edge, centered) -->
    <div id="layers-panel" class="side-panel glass w-72 rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[60vh]">
        <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-white/5">
            <span class="font-medium text-sm text-gray-200">Layers</span>
            <button class="text-gray-400 hover:text-white transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div class="p-2 flex flex-col gap-1 overflow-y-auto">
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer">
                <i data-lucide="eye" class="w-4 h-4 text-blue-400"></i>
                <div class="w-8 h-8 bg-pink-500/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-200">Highlights</span>
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer">
                <i data-lucide="eye" class="w-4 h-4 text-blue-400"></i>
                <div class="w-8 h-8 bg-blue-500/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-200">Character Base</span>
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl cursor-pointer opacity-40">
                <i data-lucide="eye-off" class="w-4 h-4 text-gray-500"></i>
                <div class="w-8 h-8 bg-gray-600/20 rounded-lg border border-gray-700"></div>
                <span class="text-sm text-gray-400">Sketch</span>
            </div>
        </div>
    </div>

    <!-- FLOATING PLAYBACK PANEL (Bottom Center) -->
    <!-- Width transitions depending on mode -->
    <div id="playback-container">
        <div id="playback-content" class="glass rounded-[1.5rem] p-4 shadow-2xl flex flex-col gap-3 w-[80vw] max-w-4xl transition-all duration-500">
            
            <!-- Header: Play + Toggle + Settings -->
            <div class="flex justify-between items-center px-2">
                <button onclick="togglePlay()" class="font-semibold text-base flex items-center gap-2 text-white hover:text-blue-400 transition-colors w-24">
                    <span id="play-text">Play</span>
                    <i data-lucide="play" id="play-icon-tl" class="w-4 h-4 fill-current"></i>
                    <i data-lucide="pause" id="pause-icon-tl" class="w-4 h-4 fill-current hidden"></i>
                </button>
                
                <!-- Toggle -->
                <div class="flex bg-black/50 p-1 rounded-lg text-xs border border-white/5">
                    <button id="mode-animation" onclick="setPlaybackMode('animation')" class="bg-gray-700 text-white px-4 py-1.5 rounded-md shadow-sm transition">Animation</button>
                    <button id="mode-timelapse" onclick="setPlaybackMode('timelapse')" class="text-gray-400 hover:text-white px-4 py-1.5 rounded-md transition">Time-lapse</button>
                </div>

                <div class="flex items-center justify-end w-24">
                    <button class="text-gray-400 hover:text-white transition-colors p-1" title="Settings">
                        <i data-lucide="settings-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- DYNAMIC TRACK AREA -->
            <div class="relative mt-1">
                
                <!-- 1. Animation Track (Thumbnails) -->
                <div id="animation-track" class="bg-black/30 rounded-xl p-2 relative flex items-center border border-white/5">
                    <div class="flex gap-1 overflow-x-auto w-full pb-2 pt-1 px-1 scroll-smooth" id="frame-track">
                        <!-- JS populated -->
                    </div>
                    <div id="active-indicator" class="absolute bottom-0 left-[12px] w-6 h-1 bg-blue-500 rounded-t-md transition-all duration-100 ease-linear"></div>
                </div>

                <!-- 2. Time-lapse Track (Zen minimal scrubber) -->
                <div id="timelapse-track" class="hidden flex items-center gap-4 py-3 px-2">
                    <span id="current-time" class="text-xs text-gray-400 font-mono w-10 text-right">00:00</span>
                    
                    <div class="flex-1 h-1.5 bg-gray-800 rounded-full overflow-hidden cursor-pointer group relative border border-gray-700" onclick="seek(event)">
                        <div id="progress-bar" class="absolute left-0 top-0 bottom-0 w-[0%] bg-blue-500 rounded-full transition-all duration-75 group-hover:bg-blue-400"></div>
                    </div>
                    
                    <span id="total-time" class="text-xs text-gray-400 font-mono w-10">02:45</span>
                </div>

            </div>
        </div>
    </div>

    <!-- THE PILL DOCK (Bottom center fixed) -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 glass rounded-full p-1.5 flex items-center gap-1 shadow-2xl z-50">
        
        <button id="btn-canvas" onclick="togglePanel('none')" class="btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2">
            <i data-lucide="maximize" class="w-4 h-4"></i>
            <span>Canvas</span>
        </button>
        
        <button id="btn-layers" onclick="togglePanel('layers')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 hover:text-white font-medium text-sm transition-all flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4"></i>
            <span>Layers</span>
        </button>

        <button id="btn-playback" onclick="togglePanel('playback')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 hover:text-white font-medium text-sm transition-all flex items-center gap-2">
            <i data-lucide="play-circle" class="w-4 h-4"></i>
            <span>Playback</span>
        </button>

        <button id="btn-info" onclick="togglePanel('info')" class="btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 hover:text-white font-medium text-sm transition-all flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span>Info</span>
        </button>

        <div class="w-px h-6 bg-gray-700 mx-1"></div>

        <button class="p-2.5 rounded-full text-gray-300 hover:bg-white/10 hover:text-white transition-all" title="Export" onclick="alert('Export modal')">
            <i data-lucide="download" class="w-4 h-4"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        // -----------------------------------------------------------------
        // 1. PANEL TOGGLE LOGIC
        // -----------------------------------------------------------------
        function togglePanel(type) {
            const panels = {
                layers: document.getElementById('layers-panel'),
                info: document.getElementById('info-panel'),
                playback: document.getElementById('playback-container')
            };
            
            const btns = {
                layers: document.getElementById('btn-layers'),
                playback: document.getElementById('btn-playback'),
                info: document.getElementById('btn-info'),
                canvas: document.getElementById('btn-canvas')
            };

            // Reset buttons
            Object.values(btns).forEach(btn => {
                btn.className = "btn-dock px-5 py-2.5 rounded-full text-gray-300 hover:bg-white/10 hover:text-white font-medium text-sm transition-all flex items-center gap-2";
            });

            // If a panel is already active and clicked again, close it (go to Canvas)
            if (type !== 'none' && panels[type].classList.contains('active')) {
                type = 'none';
            }

            // Close all first
            Object.values(panels).forEach(p => p.classList.remove('active'));

            if (type === 'none') {
                btns.canvas.className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
                if(isPlaying) togglePlay(); // pause if they leave playback view
            } else {
                panels[type].classList.add('active');
                btns[type].className = "btn-dock px-5 py-2.5 rounded-full bg-white text-black font-medium text-sm transition-all shadow-md flex items-center gap-2";
            }
        }

        // -----------------------------------------------------------------
        // 2. PLAYBACK LOGIC (Shared Animation & Time-lapse)
        // -----------------------------------------------------------------
        const TOTAL_FRAMES = 24;
        let currentFrame = 1;
        let isPlaying = false;
        let playInterval;
        let currentMode = 'animation';
        let timelapseProgress = 0;

        const track = document.getElementById('frame-track');
        const indicator = document.getElementById('active-indicator');
        const canvasFrameText = document.getElementById('canvas-frame-text');

        // Generate mock frames for Animation Track
        for (let i = 1; i <= TOTAL_FRAMES; i++) {
            const thumb = document.createElement('div');
            thumb.className = 'frame-thumb relative flex items-center justify-center text-gray-500 text-[10px] font-bold';
            // Simple stick figure mock
            thumb.style.backgroundImage = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"32\" height=\"48\" viewBox=\"0 0 32 48\"><circle cx=\"16\" cy=\"16\" r=\"5\" fill=\"none\" stroke=\"%23666\" stroke-width=\"2\"/><path d=\"M16 21 L16 34 M16 24 L8 28 M16 24 L24 28 M16 34 L10 42 M16 34 L22 42\" stroke=\"%23666\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>')";
            thumb.dataset.frame = i;
            thumb.onclick = () => { if(currentMode==='animation') setFrame(i); };
            track.appendChild(thumb);
        }

        function setPlaybackMode(mode) {
            currentMode = mode;
            
            const btnAnim = document.getElementById('mode-animation');
            const btnTime = document.getElementById('mode-timelapse');
            const pContent = document.getElementById('playback-content');
            const trackAnim = document.getElementById('animation-track');
            const trackTime = document.getElementById('timelapse-track');

            if(isPlaying) togglePlay();

            if (mode === 'animation') {
                btnAnim.className = "bg-gray-700 text-white px-4 py-1.5 rounded-md shadow-sm transition";
                btnTime.className = "text-gray-400 hover:text-white px-4 py-1.5 rounded-md transition";
                
                // Expand panel
                pContent.classList.remove('w-[500px]');
                pContent.classList.add('w-[80vw]', 'max-w-4xl');
                
                trackAnim.classList.remove('hidden');
                trackTime.classList.add('hidden');
                trackTime.classList.remove('flex');
                
                setFrame(currentFrame);
            } else {
                btnTime.className = "bg-gray-700 text-white px-4 py-1.5 rounded-md shadow-sm transition";
                btnAnim.className = "text-gray-400 hover:text-white px-4 py-1.5 rounded-md transition";
                
                // Shrink panel (Zen mode)
                pContent.classList.remove('w-[80vw]', 'max-w-4xl');
                pContent.classList.add('w-[500px]');

                trackAnim.classList.add('hidden');
                trackTime.classList.remove('hidden');
                trackTime.classList.add('flex');
                
                updateTimelapseUI();
            }
        }

        // --- ANIMATION MODE FUNCTIONS ---
        function setFrame(frameNum) {
            currentFrame = frameNum;
            Array.from(track.children).forEach(child => {
                child.classList.remove('active');
                if (parseInt(child.dataset.frame) === currentFrame) {
                    child.classList.add('active');
                    const offsetLeft = child.offsetLeft;
                    indicator.style.transform = `translateX(${offsetLeft - 12}px)`; 
                    indicator.style.width = `${child.offsetWidth}px`;
                    child.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
            canvasFrameText.innerText = currentFrame;
        }

        // --- TIMELAPSE MODE FUNCTIONS ---
        function updateTimelapseUI() {
            document.getElementById('progress-bar').style.width = `${timelapseProgress}%`;
            const totalSeconds = Math.floor((timelapseProgress / 100) * 165);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('current-time').innerText = `0${mins}:${secs < 10 ? '0'+secs : secs}`;
        }

        function seek(event) {
            const scrubber = event.currentTarget;
            const rect = scrubber.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            timelapseProgress = (clickX / rect.width) * 100;
            updateTimelapseUI();
        }

        // --- SHARED PLAY CONTROLS ---
        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-text').innerText = isPlaying ? "Pause" : "Play";
            document.getElementById('play-icon-tl').classList.toggle('hidden', isPlaying);
            document.getElementById('pause-icon-tl').classList.toggle('hidden', !isPlaying);

            if (isPlaying) {
                if (currentMode === 'animation') {
                    canvasFrameText.style.opacity = '0.3';
                    playInterval = setInterval(() => {
                        let next = currentFrame + 1;
                        if (next > TOTAL_FRAMES) next = 1;
                        setFrame(next);
                    }, 1000 / 12);
                } else {
                    playInterval = setInterval(() => {
                        timelapseProgress += 0.5;
                        if (timelapseProgress >= 100) {
                            timelapseProgress = 100;
                            togglePlay();
                        }
                        updateTimelapseUI();
                    }, 50);
                }
            } else {
                clearInterval(playInterval);
                if (currentMode === 'animation') canvasFrameText.style.opacity = '0';
            }
        }

        // Init
        setFrame(1);
    </script>
</body>
</html>
